name: Deploy to GitHub Pages

on:
  # Rebuild on every push to main.
  push:
    branches: [main]
  # Manual rebuild — use this to pull in newly added Immich photos without a
  # code change, since prerendered photo data is frozen at build time.
  workflow_dispatch:

# Let the deploy step publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight one mid-publish.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Site
        # The static build runs every load() once here — this is the only place
        # IMMICH_API_KEY is used. src/lib/immich.ts reads these from
        # $env/static/private, so they must be present as repo secrets.
        env:
          IMMICH_URL: ${{ secrets.IMMICH_URL }}
          IMMICH_API_KEY: ${{ secrets.IMMICH_API_KEY }}
        run: pnpm build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
